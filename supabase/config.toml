# Supabase CLI project configuration
# Replace project_id with your Supabase project reference (found in Project Settings > General)

project_id = "your-project-ref"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://yourdomain.com"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.sms.twilio]
enabled = false

# ---- Edge Functions ----

[functions.expire-trials]
# Triggered daily via Supabase Cron or external scheduler (GitHub Actions / Vercel Cron)
verify_jwt = false
